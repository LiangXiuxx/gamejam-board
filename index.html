<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="DGw8lGxvXbckKNzfGEkGJW">
<head data-page-node-id="d4tfjIZYaSSFGPIqeFwjgs">

<title>上一休六工作室 · Game Jam 看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com" data-page-node-id="2n4gFqF7GQkYbNg0CIlqKS">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin data-page-node-id="bbwyMEOo7AJKkSuAcp3aLm">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;700&display=swap" rel="stylesheet" data-page-node-id="VSxx3xGE9JXBrlD1MvDX4C">
<style>
:root{
  /* ============ 视觉规范：取自 Personal_Website / src/index.css「霓虹赛博档案」 ============ */
  --bg-dark:#030305;        /* 原站 --bg-dark */
  --bg-light:#0d0d14;       /* 原站 --bg-light */
  --neon-cyan:#00f3ff;      /* 原站 --neon-cyan */
  --neon-pink:#ff007f;      /* 原站 --neon-pink */
  --neon-purple:#9d00ff;    /* 原站 --neon-purple */
  --neon-gold:#ffbe0b;      /* 原站 --neon-gold */
  --neon-green:#00ff9d;     /* 补充：原站扫描线用的 60,255,110 系，用于「已完成」 */
  --text-main:#e0e0e0;      /* 原站 --text-main */
  --text-muted:#666677;     /* 原站 --text-muted */

  /* 旧变量名保留：JS 里还有内联样式引用它们 */
  --bg:#030305; --panel:#0d0d14; --panel2:#0d0d14;
  --accent:var(--neon-cyan);
  --line:rgba(0,243,255,.16); --text:var(--text-main); --muted:var(--text-muted);
  --glass:rgba(3,3,5,.64);  /* 原站 .blog-section 的面板底 */

  /* 排版：Orbitron 走「数字/英文/标题」，中文回退到思源黑，保证密排可读 */
  --cyber:'Orbitron','Noto Sans SC','Noto Sans JP',system-ui,sans-serif;
  --sans:'Noto Sans SC','Noto Sans JP',system-ui,-apple-system,'Segoe UI',sans-serif;

  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-dark);color:var(--text-main);font:14px/1.5 var(--sans);overflow-x:hidden}

/* ============ 场景层：霓虹网格 + 三段辉光 + VHS 扫描线（都在内容之下，玻璃面板会把它们糊开）============ */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(880px 520px at 10% -8%, rgba(0,243,255,.10), transparent 62%),
    radial-gradient(760px 460px at 94% 2%, rgba(255,0,127,.09), transparent 64%),
    radial-gradient(1000px 620px at 50% 112%, rgba(157,0,255,.11), transparent 68%),
    repeating-linear-gradient(to right, rgba(0,243,255,.055) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(to bottom, rgba(0,243,255,.04) 0 1px, transparent 1px 64px);
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0,243,255,.05) 3px, transparent 4px);
  animation:vhs-scanlines 8s linear infinite;
}
@keyframes vhs-scanlines{from{transform:translateY(0)}to{transform:translateY(64px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes neon-flicker{0%,100%{opacity:1}48%{opacity:1}50%{opacity:.72}52%{opacity:1}}

/* 霓虹滑动条（原站核心需求） */
::-webkit-scrollbar{width:10px;height:10px;background:var(--bg-dark)}
::-webkit-scrollbar-track{background:#020203;border-left:1px solid rgba(0,243,255,.1);box-shadow:inset 0 0 10px #000}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--neon-cyan),var(--neon-purple),var(--neon-pink));border:2px solid #020203}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--neon-pink),var(--neon-cyan))}

.app{position:relative;z-index:1;min-height:100vh}

/* ============ 顶栏：原站 nav 的玻璃态 ============ */
header{height:64px;display:flex;align-items:center;padding:0 24px;gap:24px;position:sticky;top:0;z-index:10;
  background:linear-gradient(90deg,rgba(3,3,5,.72),rgba(13,13,20,.48));
  border-bottom:1px solid rgba(0,243,255,.28);
  box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07),0 2px 22px rgba(0,243,255,.14);
  backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%)}

.logo{position:relative;font-family:var(--cyber);font-weight:900;font-size:17px;letter-spacing:4px;text-transform:uppercase;
  color:var(--neon-cyan);text-shadow:0 0 8px var(--neon-cyan),0 0 20px rgba(0,243,255,.3);white-space:nowrap}
.logo span{color:var(--neon-pink);text-shadow:0 0 8px var(--neon-pink)}
.logo::after{content:'JAMBOARD';position:absolute;left:2px;top:0;color:var(--neon-pink);text-shadow:0 0 8px var(--neon-pink);
  opacity:0;clip-path:inset(0 0 50% 0);animation:logo-glitch 4s infinite;pointer-events:none}
@keyframes logo-glitch{
  0%,92%,100%{opacity:0}
  93%{opacity:.75;clip-path:inset(0 0 50% 0);transform:translateX(-3px)}
  94%{opacity:0}
  96%{opacity:.55;clip-path:inset(40% 0 0 0);transform:translateX(2px)}
  97%{opacity:0}
}

/* 导航 = 原站 .category-btn */
.nav{display:flex;gap:8px}
.nav button{background:rgba(3,3,5,.58);border:1px solid rgba(0,243,255,.35);color:var(--neon-cyan);
  font-family:var(--cyber);font-size:11px;letter-spacing:2px;padding:8px 15px;text-transform:uppercase;
  text-shadow:0 0 8px rgba(0,243,255,.65);box-shadow:0 0 10px rgba(0,243,255,.12);transition:all .3s}
.nav button:hover{background:rgba(0,243,255,.1);box-shadow:0 0 18px rgba(0,243,255,.32)}
.nav button.active{background:var(--neon-cyan);color:#020203;text-shadow:none;box-shadow:0 0 20px rgba(0,243,255,.5)}

.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.badge{padding:5px 10px;background:rgba(3,3,5,.6);border:1px solid rgba(0,243,255,.35);color:var(--neon-cyan);
  font-family:var(--cyber);font-size:10px;letter-spacing:2px;text-transform:uppercase;white-space:nowrap;
  text-shadow:0 0 8px rgba(0,243,255,.6);box-shadow:0 0 10px rgba(0,243,255,.12)}
.badge.sync-live{color:var(--neon-green);border-color:rgba(0,255,157,.42);text-shadow:0 0 8px rgba(0,255,157,.65);box-shadow:0 0 12px rgba(0,255,157,.18)}
.badge.sync-live::first-letter{animation:blink 1s infinite}
.badge.sync-wait{color:var(--neon-gold);border-color:rgba(255,190,11,.42);text-shadow:0 0 8px rgba(255,190,11,.65);box-shadow:0 0 12px rgba(255,190,11,.18)}
.badge.sync-wait::first-letter{animation:blink 1s infinite}
.badge.sync-demo{color:var(--neon-pink);border-color:rgba(255,0,127,.45);text-shadow:0 0 8px rgba(255,0,127,.65);box-shadow:0 0 14px rgba(255,0,127,.25)}

.avatar{width:32px;height:32px;display:grid;place-items:center;background:rgba(157,0,255,.12);border:1px solid rgba(157,0,255,.5);
  color:#d9c2ff;font-family:var(--cyber);font-weight:700;font-size:11px;letter-spacing:1px;box-shadow:0 0 14px rgba(157,0,255,.28)}

main{padding:22px 24px 40px}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:16px;flex-wrap:wrap}
h1{margin:0 0 5px;font-family:var(--cyber);font-size:24px;font-weight:700;letter-spacing:3px;color:#fff;
  text-shadow:0 0 14px rgba(0,243,255,.45),0 0 34px rgba(0,243,255,.16)}
.subtitle{color:var(--text-muted)}
.section-sub{font-size:12px;color:var(--text-muted);margin-top:5px;line-height:1.7}

/* 按钮 = 原站 .btn-glitch（描边 + 从左扫入的填充） */
.actions{display:flex;gap:8px}
.btn{border:1px solid rgba(0,243,255,.45);color:var(--neon-cyan);padding:10px 16px;
  font-family:var(--cyber);font-size:11px;letter-spacing:2px;text-transform:uppercase;
  background-color:rgba(3,3,5,.6);
  background-image:linear-gradient(var(--neon-cyan),var(--neon-cyan));
  background-repeat:no-repeat;background-position:left center;background-size:0% 100%;
  text-shadow:0 0 8px rgba(0,243,255,.55);
  transition:background-size .3s,color .3s,box-shadow .3s,border-color .3s,text-shadow .3s}
.btn:hover{color:#020203;background-size:100% 100%;text-shadow:none;box-shadow:0 0 22px rgba(0,243,255,.5)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn:disabled:hover{color:var(--neon-cyan);background-size:0% 100%;box-shadow:none;text-shadow:0 0 8px rgba(0,243,255,.55)}
.btn.primary{border-color:rgba(255,0,127,.6);color:var(--neon-pink);background-color:rgba(255,0,127,.1);
  background-image:linear-gradient(var(--neon-pink),var(--neon-pink));text-shadow:0 0 8px rgba(255,0,127,.6)}
.btn.primary:hover{color:#020203;box-shadow:0 0 22px rgba(255,0,127,.5)}
.btn.danger{border-color:rgba(255,0,127,.5);color:var(--neon-pink);background-color:rgba(255,0,127,.08);
  background-image:linear-gradient(var(--neon-pink),var(--neon-pink));text-shadow:0 0 8px rgba(255,0,127,.6);margin-right:auto}

/* 指标卡 = 原站 .card（玻璃 + 悬停发光 + 切角装饰线） */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.stat{position:relative;overflow:hidden;background:var(--glass);border:1px solid rgba(255,255,255,.06);padding:16px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .4s cubic-bezier(.175,.885,.32,1.275),border-color .35s,box-shadow .35s}
.stat::after{content:'';position:absolute;left:0;top:0;width:36px;height:1px;background:var(--neon-cyan);box-shadow:0 0 10px var(--neon-cyan)}
.stat:hover{transform:translateY(-4px);border-color:rgba(0,243,255,.35);box-shadow:0 0 24px rgba(0,243,255,.16)}
.stat-label{font-family:var(--cyber);font-size:11px;letter-spacing:2px;color:#fff;margin-bottom:8px;text-transform:uppercase}
.stat-value{font-family:var(--cyber);font-size:26px;font-weight:700;color:#fff;line-height:1.1;
  text-shadow:0 0 14px rgba(0,243,255,.45)}
.stat-note{font-family:var(--sans);font-size:11px;color:var(--text-muted);margin-top:6px;letter-spacing:.3px}
.progress{height:4px;background:rgba(255,255,255,.07);margin-top:11px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--neon-cyan),var(--neon-purple),var(--neon-pink));
  box-shadow:0 0 10px rgba(0,243,255,.6);transition:width .3s}

/* 输入控件 */
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.search,.form input,.form select,.form textarea,select{
  background:rgba(3,3,5,.7);border:1px solid rgba(0,243,255,.22);color:var(--text-main);
  padding:10px 12px;outline:none;font-family:var(--sans);transition:border-color .3s,box-shadow .3s}
.search{flex:1;min-width:220px}
.search::placeholder{color:#5a5a6b;letter-spacing:.4px}
.search:focus,select:focus,.form input:focus,.form textarea:focus{border-color:var(--neon-cyan);box-shadow:0 0 16px rgba(0,243,255,.25)}
select{cursor:pointer}

/* ============ 看板 ============ */
.board-wrap{overflow-x:auto;padding-bottom:8px}
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px;min-width:1060px}
.column{position:relative;min-height:470px;background:var(--glass);border:1px solid rgba(0,243,255,.3);
  box-shadow:0 0 15px rgba(0,243,255,.1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:border-color .2s,box-shadow .2s,background .2s}
/* 每列一根状态色霓虹条，一眼分得清推进到哪一步 */
.column:nth-child(1){--st:#8b93a7}
.column:nth-child(2){--st:var(--neon-cyan)}
.column:nth-child(3){--st:var(--neon-gold)}
.column:nth-child(4){--st:var(--neon-green)}
.column.over{border-color:var(--neon-pink);background:rgba(255,0,127,.07);box-shadow:0 0 28px rgba(255,0,127,.38)}
.col-head{position:relative;display:flex;align-items:center;justify-content:space-between;padding:14px 13px 12px;
  border-bottom:1px solid rgba(0,243,255,.22);background:linear-gradient(90deg,rgba(0,243,255,.07),transparent)}
.col-head::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--st);box-shadow:0 0 12px var(--st);opacity:.9}
.col-title{font-family:var(--cyber);font-weight:700;font-size:12px;letter-spacing:3px;color:var(--st);text-transform:uppercase;
  text-shadow:0 0 10px var(--st)}
.count{font-family:var(--cyber);font-size:11px;color:var(--neon-cyan);border:1px solid rgba(0,243,255,.35);
  background:rgba(0,243,255,.08);padding:2px 8px;text-shadow:0 0 8px rgba(0,243,255,.5)}
.cards{padding:10px;min-height:420px}

/* 任务卡 = 原站 .card：玻璃 + 跟随鼠标的霓虹光斑 + 悬停浮起 */
.card{position:relative;overflow:hidden;background:rgba(13,13,20,.82);border:1px solid rgba(255,255,255,.07);
  border-left:2px solid var(--st,rgba(0,243,255,.4));padding:12px;margin-bottom:9px;cursor:grab;
  transition:transform .25s cubic-bezier(.175,.885,.32,1.275),border-color .25s,box-shadow .25s}
.card::before{content:'';position:absolute;top:var(--y,50%);left:var(--x,50%);transform:translate(-50%,-50%);
  width:260px;height:260px;background:radial-gradient(circle,rgba(0,243,255,.16) 0%,transparent 70%);
  opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover{transform:translateY(-3px);border-color:rgba(0,243,255,.45);box-shadow:0 0 22px rgba(0,243,255,.2)}
.card:hover::before{opacity:1}
.card.dragging{opacity:.45}
body.dragging .empty{opacity:1;border-color:rgba(0,243,255,.45);color:rgba(0,243,255,.7);box-shadow:inset 0 0 24px rgba(0,243,255,.1)}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.priority{font-family:var(--cyber);font-size:9.5px;font-weight:700;letter-spacing:1.5px;padding:2px 7px;border:1px solid currentColor}
.p0{color:var(--neon-pink);background:rgba(255,0,127,.1);text-shadow:0 0 8px rgba(255,0,127,.6);box-shadow:0 0 10px rgba(255,0,127,.2)}
.p1{color:var(--neon-gold);background:rgba(255,190,11,.1);text-shadow:0 0 8px rgba(255,190,11,.6);box-shadow:0 0 10px rgba(255,190,11,.2)}
.p2{color:var(--neon-cyan);background:rgba(0,243,255,.08);text-shadow:0 0 8px rgba(0,243,255,.6);box-shadow:0 0 10px rgba(0,243,255,.16)}
.type{font-size:10px;color:var(--text-muted);margin-left:auto}
.card h3{font-family:var(--sans);font-size:13px;font-weight:600;margin:10px 0 7px;color:#f2f4f8;letter-spacing:.2px}
.card-desc{font-size:11px;color:#8b93a7;margin-bottom:9px;line-height:1.6}
.card-desc.note{color:var(--neon-gold);background:rgba(255,190,11,.07);border-left:2px solid var(--neon-gold);padding:5px 8px}
.card-desc.note b{color:var(--neon-gold);font-weight:600}
.card-foot{display:flex;align-items:center;justify-content:space-between;color:var(--text-muted);font-size:10px;gap:6px}
.owner{display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-avatar{width:20px;height:20px;display:grid;place-items:center;background:rgba(157,0,255,.14);border:1px solid rgba(157,0,255,.42);
  color:#d9c2ff;font-family:var(--cyber);font-size:8px;font-weight:700;flex:0 0 auto}
.tag{padding:2px 7px;background:rgba(157,0,255,.06);border:1px solid rgba(157,0,255,.3);color:var(--neon-purple);
  font-size:9.5px;letter-spacing:1px;flex:0 0 auto}
.empty{padding:20px 10px;text-align:center;color:#4a4a5c;font-family:var(--cyber);font-size:10px;letter-spacing:2px;
  text-transform:uppercase;border:1px dashed rgba(0,243,255,.2);opacity:0;transition:opacity .2s,box-shadow .2s,border-color .2s}
.empty.on{opacity:1}

/* 中英双行副标题（原站 .font-cyber 的排版） */
.sub{display:block;font-family:var(--cyber);font-size:8.5px;font-weight:400;letter-spacing:2px;margin-top:4px;
  text-transform:uppercase;color:rgba(0,243,255,.55);text-shadow:none}
i.en{font-style:normal;font-family:var(--cyber);font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(0,243,255,.5);margin-left:5px}

/* 视图切换 */
.view{display:none}
.view.active{display:block}

/* ============ 甘特图 ============ */
.gantt-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:11px;color:var(--text-muted);align-items:center}
.gantt-legend span{display:flex;align-items:center;gap:6px}
.gantt-legend i{width:11px;height:11px;display:block}
.gantt{background:var(--glass);border:1px solid rgba(0,243,255,.3);box-shadow:0 0 15px rgba(0,243,255,.1);
  padding:16px;overflow-x:auto;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.g-inner{min-width:1266px}
.g-head{display:flex;align-items:flex-end;margin-bottom:4px}
.g-name{width:216px;flex:0 0 216px;font-family:var(--cyber);font-size:10px;letter-spacing:2px;color:var(--text-muted);
  padding-left:2px;text-transform:uppercase}
.g-days{flex:1;display:grid;grid-template-columns:repeat(var(--days,21),1fr)}
.g-days div{font-family:var(--cyber);font-size:9px;letter-spacing:.5px;color:#5a6472;text-align:center;padding-bottom:6px;
  border-left:1px solid rgba(0,243,255,.12)}
.g-days div.today{color:var(--neon-cyan);font-weight:700;text-shadow:0 0 10px rgba(0,243,255,.7)}
.g-row{display:flex;align-items:center;height:32px;border-top:1px solid rgba(0,243,255,.1)}
.g-row:hover{background:rgba(0,243,255,.05)}
.g-label{width:216px;flex:0 0 216px;display:flex;align-items:center;gap:7px;padding-right:12px;overflow:hidden}
.g-label .gt{font-size:12px;color:#c9cfda;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.g-label .gt:hover{color:var(--neon-cyan);text-shadow:0 0 8px rgba(0,243,255,.7)}
.g-track{flex:1;position:relative;height:32px;
  background-image:repeating-linear-gradient(to right,rgba(0,243,255,.14) 0,rgba(0,243,255,.14) 1px,transparent 1px,transparent var(--dayw,4.761905%))}
.g-seg{position:absolute;top:7px;height:18px;min-width:2px}
.g-seg.todo{background:#5b6472;box-shadow:0 0 10px rgba(140,150,175,.45)}
.g-seg.doing{background:var(--neon-cyan);box-shadow:0 0 12px rgba(0,243,255,.65)}
.g-seg.review{background:var(--neon-gold);box-shadow:0 0 12px rgba(255,190,11,.65)}
.g-seg.done{background:var(--neon-green);box-shadow:0 0 12px rgba(0,255,157,.65)}
.g-seg:hover{filter:brightness(1.35);z-index:3}
.g-now{position:absolute;top:3px;bottom:3px;width:2px;background:var(--neon-pink);box-shadow:0 0 10px var(--neon-pink);
  opacity:.9;pointer-events:none;z-index:2}
.g-empty{padding:28px;text-align:center;color:#5a6472;font-size:12px}
.g-note{margin-top:12px;font-size:11px;color:#5a6472;line-height:1.75}
.g-note b{color:var(--neon-cyan);font-weight:600;text-shadow:0 0 8px rgba(0,243,255,.5)}

/* ============ 团队 ============ */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.member{position:relative;background:var(--glass);border:1px solid rgba(0,243,255,.24);padding:15px;
  box-shadow:0 0 15px rgba(0,243,255,.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:border-color .3s,box-shadow .3s,transform .3s}
.member:hover{border-color:rgba(0,243,255,.5);box-shadow:0 0 26px rgba(0,243,255,.2);transform:translateY(-3px)}
.member-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.big-avatar{width:38px;height:38px;display:grid;place-items:center;background:rgba(157,0,255,.12);border:1px solid rgba(157,0,255,.45);
  color:#d9c2ff;font-family:var(--cyber);font-weight:700;font-size:12px;flex:0 0 auto;box-shadow:0 0 14px rgba(157,0,255,.28)}
.member-name{font-weight:700;font-size:14px;letter-spacing:.5px;color:#fff}
.role{font-size:11px;color:var(--text-muted);letter-spacing:.5px}
.member-counts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.mc{font-family:var(--cyber);font-size:9px;letter-spacing:1px;padding:3px 8px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);color:#a8b0bd}
.mc.doing{background:rgba(0,243,255,.1);border-color:rgba(0,243,255,.4);color:var(--neon-cyan)}
.mc.review{background:rgba(255,190,11,.1);border-color:rgba(255,190,11,.4);color:var(--neon-gold)}
.mc.done{background:rgba(0,255,157,.1);border-color:rgba(0,255,157,.4);color:var(--neon-green)}
.member-tasks{border-top:1px solid rgba(0,243,255,.16);margin-top:11px;padding-top:9px}
.mtask{display:flex;align-items:center;gap:9px;padding:6px;cursor:pointer;transition:background .2s}
.mtask:hover{background:rgba(0,243,255,.06)}
.mtask .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.dot.todo{background:#5b6472;box-shadow:0 0 8px rgba(140,150,175,.7)}
.dot.doing{background:var(--neon-cyan);box-shadow:0 0 8px var(--neon-cyan)}
.dot.review{background:var(--neon-gold);box-shadow:0 0 8px var(--neon-gold)}
.dot.done{background:var(--neon-green);box-shadow:0 0 8px var(--neon-green)}
.mtask .mt{font-size:12px;color:#c9cfda;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtask .mp{font-family:var(--cyber);font-size:8.5px;font-weight:700;padding:2px 5px;border:1px solid currentColor}
.mempty{font-size:11.5px;color:#5d6875;padding:8px 5px}

/* 离线横幅 */
.banner{display:none;margin:0 0 16px;padding:13px 15px;background:rgba(255,0,127,.08);border:1px solid rgba(255,0,127,.5);
  color:#ffd0e0;font-size:12.5px;line-height:1.65;align-items:center;gap:12px;flex-wrap:wrap;
  box-shadow:0 0 24px rgba(255,0,127,.2)}
.banner.show{display:flex}
.banner b{color:var(--neon-pink);text-shadow:0 0 8px rgba(255,0,127,.6)}
.banner code{background:rgba(255,0,127,.12);border:1px solid rgba(255,0,127,.3);padding:1px 6px;color:#ffc2d8;font-size:11.5px}
.banner .btn{padding:7px 13px;font-size:10px;margin-left:auto;flex:0 0 auto}
.banner .btn.go{border-color:rgba(0,243,255,.5);color:var(--neon-cyan);background-color:rgba(0,243,255,.1);
  background-image:linear-gradient(var(--neon-cyan),var(--neon-cyan));text-shadow:0 0 8px rgba(0,243,255,.6)}

/* ============ 弹窗（原站玻璃面板 + 对角霓虹装饰）============ */
.overlay{display:none;position:fixed;inset:0;background:rgba(2,2,3,.82);z-index:20;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal{position:relative;width:min(520px,92vw);max-height:90vh;overflow:auto;padding:22px;
  background:rgba(3,3,5,.93);border:1px solid rgba(0,243,255,.4);
  box-shadow:0 0 40px rgba(0,243,255,.2),0 30px 90px #000;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.modal::before{content:'';position:absolute;top:-1px;left:-1px;width:22px;height:22px;pointer-events:none;
  border-top:2px solid var(--neon-cyan);border-left:2px solid var(--neon-cyan);box-shadow:0 0 12px rgba(0,243,255,.6)}
.modal::after{content:'';position:absolute;bottom:-1px;right:-1px;width:22px;height:22px;pointer-events:none;
  border-bottom:2px solid var(--neon-pink);border-right:2px solid var(--neon-pink);box-shadow:0 0 12px rgba(255,0,127,.6)}
.modal h2{margin:0 0 18px;font-family:var(--cyber);font-size:15px;letter-spacing:3px;text-transform:uppercase;color:#fff;
  text-shadow:0 0 12px rgba(0,243,255,.5)}
.form{display:grid;gap:12px}
.form label{font-size:11px;color:var(--text-muted);display:block;letter-spacing:.5px}
.form input,.form select,.form textarea{width:100%;margin-top:6px}
.form textarea{resize:vertical;min-height:54px}
.form.two{grid-template-columns:1fr 1fr}
.form .span2{grid-column:1/-1}
.hist{margin-top:18px;border-top:1px solid rgba(0,243,255,.16);padding-top:13px}
.hist-title{font-family:var(--cyber);font-size:10px;letter-spacing:2px;color:var(--text-muted);margin-bottom:9px;text-transform:uppercase}
.hrow{display:flex;gap:9px;align-items:baseline;font-size:11.5px;color:#a8b0bd;padding:4px 0}
.hrow .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;position:relative;top:-1px}
.hrow .ht{color:var(--text-muted);flex:0 0 auto;font-family:var(--cyber);font-size:10px;letter-spacing:.5px}
.hrow .hn{color:var(--neon-gold);text-shadow:0 0 8px rgba(255,190,11,.45)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* ============ Toast ============ */
.toast{position:fixed;right:20px;bottom:20px;display:none;z-index:80;max-width:min(420px,86vw);align-items:center;gap:12px;
  padding:12px 15px;font-size:12.5px;background:rgba(3,3,5,.94);color:var(--text-main);
  border:1px solid rgba(0,243,255,.5);box-shadow:0 0 28px rgba(0,243,255,.3);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.toast.show{display:flex}
.toast .undo{display:none;background:var(--neon-cyan);color:#020203;border:0;padding:5px 11px;cursor:pointer;flex:0 0 auto;
  font-family:var(--cyber);font-size:10px;letter-spacing:1.5px;font-weight:700}
.toast.undoable .undo{display:inline-block}
.toast.err{background:rgba(30,2,10,.95);border-color:var(--neon-pink);color:#ffd0e0;box-shadow:0 0 28px rgba(255,0,127,.35)}
.toast.err .undo{background:var(--neon-pink);color:#020203}

@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .team{grid-template-columns:1fr 1fr}
  header{padding:0 12px}

}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

const STATUS_DEFS = [
  {id:"todo",   zh:"待办",   en:"TO DO",
   aliases:["todo","backlog","ready","待办","待规划","待开始","未开始","想法","灵感"]},
  {id:"doing",  zh:"进行中", en:"IN PROGRESS",
   aliases:["doing","in progress","inprogress","wip","进行中","开发中","在做",
            "blocked","阻塞","卡住","被阻塞"]},
  {id:"review", zh:"待验收", en:"REVIEW",
   aliases:["review","testing","test","qa","待验收","验收","评审中","测试中","测试"]},
  {id:"done",   zh:"已完成", en:"DONE",
   aliases:["done","closed","已完成","完成","已发布"]}
];
const STATUS_IDS = STATUS_DEFS.map(s => s.id);

function statusDef(id){
  return STATUS_DEFS.find(s => s.id === id) || STATUS_DEFS[0];
}

/* 甘特图一天的毫秒数 */

// 入库值 -> [中文, 英文]
const TYPE_DEFS = [
  {value:"Programming", zh:"程序", en:"Programming"},
  {value:"Art",         zh:"美术", en:"Art"},
  {value:"Design",      zh:"策划", en:"Design"},
  {value:"Production",  zh:"制作", en:"Production"}
];

function normalizeStatus(raw){
  const s = String(raw==null?"":raw).trim().toLowerCase();
  for(const def of STATUS_DEFS) if(def.aliases.includes(s)) return def.id;
  return "todo";
}
function normalizePriority(raw){
  const s = String(raw==null?"":raw).trim().toUpperCase();
  return ["P0","P1","P2"].includes(s) ? s : "P2";
}
function typeZh(raw){
  const v = String(raw==null?"":raw).trim();
  const hit = TYPE_DEFS.find(t => t.value.toLowerCase() === v.toLowerCase() || t.zh === v);
  return hit ? hit.zh : (v || "未分类");
}
function typeEn(raw){
  const v = String(raw==null?"":raw).trim();
  const hit = TYPE_DEFS.find(t => t.value.toLowerCase() === v.toLowerCase() || t.zh === v);
  return hit ? hit.en : v;
}

/* 头像缩写：支持「角色_名字」格式（策划_三明治 → 三），也兼容旧的 程序 A / PM A / 美术 */
function avatar(owner){
  const s = String(owner||"?").trim();
  let m;
  if(s.includes("_")){
    const name = s.split("_").pop().trim();
    if(name){
      const cjk = name.match(/[\u4e00-\u9fa5]/);
      return cjk ? cjk[0] : name.slice(0,2).toUpperCase();
    }
  }
  if(/^美术/.test(s)) return "美";
  if((m = s.match(/^程序(员)?\s*([A-Za-z0-9]+)$/))) return "P"+m[2].toUpperCase();
  if((m = s.match(/^(PM|项目经理)\s*([A-Za-z0-9]+)$/i))) return "M"+m[2].toUpperCase();
  return s.slice(0,2) || "?";
}

/* 角色：优先从名字前缀取（策划_三明治 → 策划），旧格式再按字面判断 */
function roleOf(owner){
  const s = String(owner||"").trim();
  if(s.includes("_")) return s.split("_")[0].trim();
  const m = s.match(/^(程序|美术|策划|音效|PM|项目经理|制作)/);
  return m ? (m[1] === "项目经理" ? "PM" : m[1]) : "";
}

function jamStarted(){ return Date.now() >= jamStartMs(); }

/* 顶部徽标：没开赛显示倒计时，开赛后显示第 N / 总天数 */
function jamBadge(){
  if(!JAM_START) return "–";
  if(!jamStarted()){
    const left = Math.ceil((jamStartMs() - Date.now()) / DAY_MS);
    return `距开赛 ${left} 天`;
  }
  return `第 ${Math.min(jamDayNum(), JAM_DAYS)} / ${JAM_DAYS} 天`;
}
function jamDayNum(){
  return Math.floor((Date.now() - jamStartMs()) / DAY_MS) + 1;
}
function jamDay(){
  if(!JAM_START) return "–";
  return jamStarted() ? jamDayNum() : "–";
}

/* 卡片右下角的截止提示：P0 必须赶在功能冻结前，P1/P2 依次往后 */
function deadlineTag(t){
  const d = t.priority === "P0" ? FREEZE_DAY
          : t.priority === "P1" ? Math.min(FREEZE_DAY + 3, JAM_DAYS)
          : JAM_DAYS;
  return `第 ${d} 天`;
}

function jamStartMs(){ return new Date(JAM_START + "T00:00:00+08:00").getTime(); }
function jamEndMs(){ return jamStartMs() + JAM_DAYS * DAY_MS; }
function dayOf(ms){ return Math.floor((ms - jamStartMs()) / DAY_MS) + 1; }   // 第几天，1 起
function pctOf(ms){                                                          // 在整段赛程里的位置%
  return Math.min(100, Math.max(0, (ms - jamStartMs()) / (JAM_DAYS * DAY_MS) * 100));
}

/* Firestore Timestamp / Date / 数字 / 字符串 统一转毫秒 */
function toMs(v){
  if(v == null) return null;
  if(typeof v === "number") return v;
  if(typeof v === "string"){ const t = Date.parse(v); return isNaN(t) ? null : t; }
  if(typeof v.toMillis === "function") return v.toMillis();
  if(v.seconds != null) return v.seconds * 1000 + Math.floor((v.nanoseconds || 0) / 1e6);
  if(v instanceof Date) return v.getTime();
  return null;
}
function fmtDT(ms){
  const d = new Date(ms);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function fmtDay(ms){
  const d = new Date(ms);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

/* ---- 历史记录（甘特图的数据来源）----
   每次状态变化往 history 里追加一条 {to, at}。误拖由「撤销」补救，
   而不是靠降低记录频率——每天一个快照会把两次快照之间的变化全丢掉。 */
function normalizeHistory(raw, fallbackAt, status){
  const out = [];
  if(Array.isArray(raw)){
    for(const e of raw){
      if(!e) continue;
      const at = toMs(e.at);
      const to = STATUS_IDS.includes(e.to) ? e.to : normalizeStatus(e.to);
      if(at) out.push({ to, at });
    }
  }
  out.sort((a,b) => a.at - b.at);
  if(!out.length){
    // 老数据没有 history：退化成"从创建时间起一直是当前状态"
    out.push({ to: status, at: fallbackAt || Date.now() });
  }
  return out;
}

/* 把 history 切成甘特图上的色段：[{status, from, to}] */
function toSegments(hist, nowMs){
  const segs = [];
  for(let i = 0; i < hist.length; i++){
    const from = hist[i].at;
    const to   = (i + 1 < hist.length) ? hist[i+1].at : nowMs;
    segs.push({ status: hist[i].to, from, to: Math.max(to, from) });
  }
  return segs;
}

function shortDur(ms){
  const h = ms / 3600000;
  if(h < 1)   return Math.max(1, Math.round(ms/60000)) + " 分";
  if(h < 48)  return (Math.round(h*10)/10) + " 小时";
  return (Math.round(h/24*10)/10) + " 天";
}

/* 视图切换（三个 tab 是三个视图，不是三个独立页面）*/
function setView(name, push){
  const ok = ["board","timeline","team"];
  if(!ok.includes(name)) name = "board";
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + name));
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("active", b.dataset.view === name));

}

function startFirestore(){
  initializeApp(firebaseConfig);
  db = getFirestore();
  const col = collection(db, COLLECTION);
  onSnapshot(col,
    snap => {
      live = true;
      booting = false;
      tasks = snap.docs.map(d => {
        const v = d.data() || {};
        const status = normalizeStatus(v.status);
        const created = toMs(v.createdAt) || toMs(v.updatedAt) || Date.now();
        return {
          id: d.id,
          title: v.title || "(未命名任务)",
          owner: v.owner || "未分配",
          priority: normalizePriority(v.priority),
          type: v.type || "Programming",
          status,
          desc: v.desc || v.description || "",
          rework: Number(v.rework) || 0,
          reviewNote: v.reviewNote || "",
          createdAt: created,
          history: normalizeHistory(v.history, created, status),
          seq: v.order ?? 0
        };
      });
      setSync("live", "● 已同步");
      hideBanner();
      render();
    },
    err => {
      console.error("[firestore]", err);
      fallBack("Firestore 读取失败，已切到本地演示数据（改动不会保存）", err);
    }
  );
}

function fallBack(msg, err){
  live = false;
  booting = false;
  // 示例数据也要有 history，否则甘特图是空的
  const t0 = jamStartMs() + DAY_MS * 0.3;
  tasks = DEMO_TASKS.map((t,i)=>{
    const at = t0 + i * 3600000 * 7;
    const order = ["todo","doing","review","done"];
    const upto  = order.indexOf(t.status);
    const hist  = [{ to:"todo", at }];
    for(let k=1;k<=upto;k++) hist.push({ to: order[k], at: at + k * 3600000 * 20 });
    return { ...t, id:"demo-"+i, seq:i, createdAt:at, rework:0, reviewNote:"", history:hist };
  });
  setSync("demo", "○ 未连接");
  const code = err ? (err.code || err.message || "") : "";
  showBanner(
    `<b>未连接 Firestore</b> · 当前是离线演示模式，下面显示的是内置示例数据，` +
    `<b>你的任何改动刷新后都会丢失</b>。` +
    (code ? `原因：<code>${esc(code)}</code>。` : "") +
    `去 Firebase 控制台 → Firestore Database → Rules 发布规则，然后点右侧「重试连接」。`
  );
  render();
  showToast(msg + (code ? "  · " + code : ""), true);
}

function renderBoard(){
  const q  = document.getElementById("search").value.trim().toLowerCase();
  const pf = document.getElementById("priorityFilter").value;
  const of_ = document.getElementById("ownerFilter").value;

  // 负责人下拉：用真实数据重建（保留当前选择）
  const owners = [...new Set(tasks.map(t=>t.owner))].sort();
  const osel = document.getElementById("ownerFilter");
  const keep = owners.includes(of_) ? of_ : "all";
  osel.innerHTML = '<option value="all">全部成员</option>' +
    owners.map(o=>`<option value="${esc(o)}"${o===keep?" selected":""}>${esc(o)}</option>`).join("");

  const board = document.getElementById("board");
  board.innerHTML = "";

  STATUS_DEFS.forEach(def => {
    let list = tasks.filter(t => t.status === def.id);
    if(pf !== "all") list = list.filter(t => t.priority === pf);
    if(keep !== "all") list = list.filter(t => t.owner === keep);
    if(q) list = list.filter(t => [t.title,t.owner,t.type,t.desc].join(" ").toLowerCase().includes(q));
    list.sort((a,b)=> (PRI_RANK[a.priority]-PRI_RANK[b.priority]) || String(a.title).localeCompare(String(b.title),"zh"));

    const col = document.createElement("div");
    col.className = "column";
    col.innerHTML =
      `<div class="col-head"><div><div class="col-title">${def.zh}<span class="sub">${def.en}</span></div></div>` +
      `<span class="count">${list.length}</span></div><div class="cards"></div>`;
    const cards = col.querySelector(".cards");

    if(!list.length){
      cards.innerHTML = booting
        ? '<div class="empty on">正在连接 Firestore…</div>'
        : '<div class="empty">拖任务到这里</div>';
    }
    list.forEach(t => {
      const c = document.createElement("div");
      c.className = "card";
      c.draggable = true;
      c.dataset.id = t.id;
      c.innerHTML =
        `<div class="card-top"><span class="priority ${t.priority.toLowerCase()}">${t.priority}</span>` +
        `<span class="type">${esc(typeZh(t.type))}<i class="en">${esc(typeEn(t.type))}</i></span></div>` +
        `<h3>${esc(t.title)}</h3>` +
        (t.desc ? `<div class="card-desc">${esc(t.desc)}</div>` : "") +
        (t.reviewNote ? `<div class="card-desc note"><b>驳回：</b>${esc(t.reviewNote)}</div>` : "") +
        (t.rework > 0 ? `<div class="card-desc note">返工 ×${t.rework}</div>` : "") +
        `<div class="card-foot"><span class="owner"><span class="mini-avatar">${esc(avatar(t.owner))}</span>${esc(t.owner)}</span>` +
        `<span class="tag">${esc(deadlineTag(t))}</span></div>`;

      c.onclick = () => openDetail(t);
      c.addEventListener("dragstart", e => {
        c.classList.add("dragging");
        document.body.classList.add("dragging");
        e.dataTransfer.setData("text/plain", t.id);
        e.dataTransfer.effectAllowed = "move";
      });
      c.addEventListener("dragend", () => {
        c.classList.remove("dragging");
        document.body.classList.remove("dragging");
      });
      cards.appendChild(c);
    });

    cards.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("over"); });
    cards.addEventListener("dragleave", () => col.classList.remove("over"));
    cards.addEventListener("drop", e => {
      e.preventDefault(); col.classList.remove("over");
      const id = e.dataTransfer.getData("text/plain");
      const t = tasks.find(x => x.id === id);
      if(!t || t.status === def.id) return;
      // 从「待验收」往回拖 = 验收不合格，走驳回流程（要填原因）
      if(t.status === "review" && (def.id === "doing" || def.id === "todo")){
        openReject(t, def.id);
        return;
      }
      moveTask(t, def.id);
    });
    board.appendChild(col);
  });

  updateStats();
}

function updateStats(){
  const total = tasks.length;
  const done  = tasks.filter(t=>t.status==="done").length;
  const doing = tasks.filter(t=>t.status==="doing").length;
  const rev   = tasks.filter(t=>t.status==="review").length;
  const pct   = total ? Math.round(done/total*100) : 0;
  document.getElementById("total").textContent = total;
  document.getElementById("priBreak").textContent =
    `P0 ${tasks.filter(t=>t.priority==="P0").length} · P1 ${tasks.filter(t=>t.priority==="P1").length} · P2 ${tasks.filter(t=>t.priority==="P2").length}`;
  document.getElementById("completion").textContent = pct + "%";
  document.getElementById("progress").style.width = pct + "%";
  document.getElementById("doing").textContent = doing;
  document.getElementById("reviewCnt").textContent = rev;

  // 下一个节点：到功能冻结还有几天（没开赛就显示距开赛）
  const msEl = document.getElementById("nextMs"), noteEl = document.getElementById("nextMsNote");
  msEl.textContent = `第 ${FREEZE_DAY} 天`;
  if(!jamStarted()){
    noteEl.textContent = `功能冻结 · 距开赛 ${Math.ceil((jamStartMs()-Date.now())/DAY_MS)} 天`;
  }else{
    const left = FREEZE_DAY - jamDayNum();
    noteEl.textContent = left > 0 ? `功能冻结 · 还剩 ${left} 天`
                       : left === 0 ? "功能冻结 · 就是今天"
                       : `功能冻结 · 已过 ${-left} 天`;
  }
}

/* ============================================================
   团队视图：每个人手上具体有哪些任务、分别停在哪一步
   ============================================================ */
const ROLE_HINT = { todo:"待办", doing:"进行中", review:"待验收", done:"已完成" };

function renderTeam(){
  const box = document.getElementById("team");
  if(!box) return;

  // 有任务的人 + 预设成员，按"在手任务数"降序，让人一眼看到谁最忙
  const names = [...new Set([...MEMBERS, ...tasks.map(t => t.owner)])].sort();
  const rows = names.map(n => {
    const mine = tasks.filter(t => t.owner === n);
    const by = st => mine.filter(t => t.status === st);
    return { name:n, mine, doing:by("doing").length, review:by("review").length,
             todo:by("todo").length, done:by("done").length };
  }).sort((a,b) => (b.doing + b.review) - (a.doing + a.review) || b.mine.length - a.mine.length);

  box.innerHTML = rows.map(r => {
    // 角色优先从名字前缀取（策划_三明治 → 策划）；旧格式或没任务时退回按任务类型推
    const fromName = roleOf(r.name);
    const fromType = r.mine.length ? [...new Set(r.mine.map(t => typeZh(t.type)))].join(" / ") : "";
    const role = fromName ? (fromType ? `${fromName} · ${fromType}` : fromName) : (fromType || "暂无任务");
    const counts =
      `<span class="mc doing">进行中 ${r.doing}</span>` +
      `<span class="mc review">待验收 ${r.review}</span>` +
      `<span class="mc">待办 ${r.todo}</span>` +
      `<span class="mc done">已完成 ${r.done}</span>`;

    const list = r.mine.length
      ? [...r.mine].sort((a,b) =>
          (STATUS_IDS.indexOf(a.status) - STATUS_IDS.indexOf(b.status)) ||
          (PRI_RANK[a.priority] - PRI_RANK[b.priority]) ||
          String(a.title).localeCompare(String(b.title), "zh")
        ).map(t =>
          `<div class="mtask" data-id="${esc(t.id)}">` +
            `<span class="dot ${t.status}"></span>` +
            `<span class="mt">${esc(t.title)}</span>` +
            `<span class="priority ${t.priority.toLowerCase()}">${t.priority}</span>` +
          `</div>`
        ).join("")
      : `<div class="mempty">暂无任务</div>`;

    return `<div class="member">` +
      `<div class="member-top"><div class="big-avatar">${esc(avatar(r.name))}</div>` +
        `<div><div class="member-name">${esc(r.name)}</div><div class="role">${esc(role)}</div></div></div>` +
      `<div class="member-counts">${counts}</div>` +
      `<div class="member-tasks">${list}</div>` +
    `</div>`;
  }).join("");

  box.querySelectorAll(".mtask").forEach(el => {
    el.onclick = () => {
      const t = tasks.find(x => x.id === el.dataset.id);
      if(t) openDetail(t);
    };
  });
}

/* ============================================================
   7) 写操作
   ============================================================ */
/* 每次状态变化追加一条历史，甘特图就是靠它画出来的。
   误拖不靠"降低记录频率"来防（每天一个快照会丢掉两次快照之间的所有变化），
   而是靠下面的「撤销」。 */
function pushHistory(t, toStatus){
  const hist = Array.isArray(t.history) ? t.history.slice() : [];
  hist.push({ to: toStatus, at: Date.now() });
  return hist;
}

// 记录最近一次移动，供撤销使用
let lastMove = null;
let undoTask = null;

async function moveTask(t, status, opts){
  if(!live){
    showToast("离线演示模式：改动不会保存，请先发布 Firestore 规则", true);
    render();
    return;
  }
  const from = t.status;
  const hist = pushHistory(t, status);
  const patch = { status, history: hist.map(h => ({ to: h.to, at: new Date(h.at) })), updatedAt: serverTimestamp() };
  // 通过验收：清掉驳回原因（返工次数保留，作为历史）
  if(status === "done") patch.reviewNote = "";

  try{
    await updateDoc(doc(db, COLLECTION, t.id), patch);
    lastMove = { id: t.id, from, to: status, prevHistory: Array.isArray(t.history) ? t.history : [] };
    showToast(`已移到「${statusDef(status).zh}」：${t.title}`, false, true);
  }catch(e){
    console.error(e);
    showToast("移动失败：" + (e.code || e.message), true);
  }
}

/* 撤销误拖：状态退回，并删掉刚追加的那条历史 */
async function undoMove(){
  const m = lastMove;
  lastMove = null;
  if(!m) return;
  if(!live){ showToast("离线演示模式：无法撤销", true); return; }
  try{
    await updateDoc(doc(db, COLLECTION, m.id), {
      status: m.from,
      history: m.prevHistory.map(h => ({ to: h.to, at: new Date(h.at) })),
      updatedAt: serverTimestamp()
    });
    showToast("已撤销，状态退回「" + statusDef(m.from).zh + "」");
  }catch(e){
    showToast("撤销失败：" + (e.code || e.message), true);
  }
}

/* 验收不合格：从「待验收」往回拖时触发，必须记下原因 */
let rejectCtx = null;
function openReject(t, targetStatus){
  if(!live){ showToast("离线演示模式：改动不会保存，请先发布 Firestore 规则", true); render(); return; }
  rejectCtx = { t, targetStatus };
  const box = document.getElementById("rejectNote");
  box.value = "";
  document.getElementById("rejectModal").style.display = "flex";
  box.focus();
}
function closeReject(){
  document.getElementById("rejectModal").style.display = "none";
  rejectCtx = null;
}
async function confirmReject(){
  if(!rejectCtx) return;
  const { t, targetStatus } = rejectCtx;
  const note = document.getElementById("rejectNote").value.trim();
  const n = (t.rework || 0) + 1;
  closeReject();
  const hist = pushHistory(t, targetStatus);
  try{
    await updateDoc(doc(db, COLLECTION, t.id), {
      status: targetStatus,
      rework: n,
      reviewNote: note || "验收不合格",
      history: hist.map(h => ({ to: h.to, at: new Date(h.at) })),
      updatedAt: serverTimestamp()
    });
    showToast(`已打回「${statusDef(targetStatus).zh}」· 第 ${n} 次返工：${t.title}`, false, true);
  }catch(e){
    showToast("打回失败：" + (e.code || e.message), true);
  }
}

async function removeTask(t){
  if(!live){ showToast("离线演示模式：无法删除", true); return; }
  if(!confirm(`删除任务「${t.title}」？\n此操作不可撤销。`)) return;
  try{
    await deleteDoc(doc(db, COLLECTION, t.id));
    showToast("已删除：" + t.title);
  }catch(e){
    showToast("删除失败：" + (e.code || e.message), true);
  }
}

function openCreate(){
  document.getElementById("modal").style.display = "flex";
  document.getElementById("newTitle").focus();
}
function closeModal(){ document.getElementById("modal").style.display = "none"; }

async function createTask(){
  const title = document.getElementById("newTitle").value.trim();
  if(!title){ showToast("任务名不能为空", true); return; }

  if(!live){
    showToast("离线演示模式：无法保存。请先在 Firebase 控制台发布 Firestore 规则，再点「重试连接」", true);
    return;
  }

  const now = new Date();
  const status = document.getElementById("newStatus").value;
  const payload = {
    title,
    owner:    document.getElementById("newOwner").value,
    status,
    priority: document.getElementById("newPriority").value,
    type:     document.getElementById("newType").value,
    desc:     document.getElementById("newDesc").value.trim(),
    history:  [{ to: status, at: now }],
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp()
  };
  try{
    await addDoc(collection(db, COLLECTION), payload);
    document.getElementById("newTitle").value = "";
    document.getElementById("newDesc").value = "";
    closeModal();
    showToast("任务已创建");
  }catch(e){
    console.error(e);
    showToast("创建失败：" + (e.code || e.message), true);
  }
}

/* ============================================================
   任务详情 / 编辑
   ============================================================ */
let detailId = null;

function openDetail(t){
  detailId = t.id;
  document.getElementById("dTitle").value    = t.title;
  document.getElementById("dOwner").value    = t.owner;
  document.getElementById("dStatus").value   = t.status;
  document.getElementById("dPriority").value = t.priority;
  document.getElementById("dType").value     = t.type;
  document.getElementById("dDesc").value     = t.desc || "";

  // 阶段记录：每条显示 状态 + 时间 + 停留时长
  const hist = Array.isArray(t.history) && t.history.length ? t.history : [{ to:t.status, at:t.createdAt }];
  const segs = toSegments(hist, Date.now());
  const nowMs = Date.now();
  document.getElementById("dHist").innerHTML = hist.map((h, i) => {
    const dur  = i === 0 ? "" : shortDur(h.at - hist[i-1].at);
    const live = (i === hist.length - 1);
    return `<div class="hrow">` +
      `<span class="dot ${h.to}"></span>` +
      `<span class="ht">${fmtDT(h.at)}</span>` +
      `<span>进入「${statusDef(h.to).zh}」</span>` +
      `<span class="hn">${live ? "已停留 " + shortDur(nowMs - h.at) : dur}</span>` +
    `</div>`;
  }).join("") + `<div class="hrow" style="color:#5a6472">` +
      `<span class="dot" style="background:#5b6472"></span>` +
      `<span class="ht">${fmtDT(t.createdAt)}</span><span>创建任务</span></div>`;

  document.getElementById("detailModal").style.display = "flex";
}
function closeDetail(){
  document.getElementById("detailModal").style.display = "none";
  detailId = null;
}
async function saveDetail(){
  const t = tasks.find(x => x.id === detailId);
  if(!t) return;
  const title = document.getElementById("dTitle").value.trim();
  if(!title){ showToast("任务名不能为空", true); return; }

  const next = {
    owner:    document.getElementById("dOwner").value,
    status:   document.getElementById("dStatus").value,
    priority: document.getElementById("dPriority").value,
    type:     document.getElementById("dType").value,
    desc:     document.getElementById("dDesc").value.trim()
  };
  const patch = { ...next, updatedAt: serverTimestamp() };
  if(next.status !== t.status){
    patch.history = pushHistory(t, next.status).map(h => ({ to: h.to, at: new Date(h.at) }));
    if(next.status === "done") patch.reviewNote = "";
  }
  try{
    await updateDoc(doc(db, COLLECTION, t.id), patch);
    closeDetail();
    showToast("已保存");
  }catch(e){
    showToast("保存失败：" + (e.code || e.message), true);
  }
}
async function deleteDetail(){
  const t = tasks.find(x => x.id === detailId);
  if(!t) return;
  const id = t.id;
  if(!confirm(`删除任务「${t.title}」？\n此操作不可撤销。`)) return;
  closeDetail();
  if(!live){ showToast("离线演示模式：无法删除", true); return; }
  try{
    await deleteDoc(doc(db, COLLECTION, id));
    showToast("已删除：" + t.title);
  }catch(e){
    showToast("删除失败：" + (e.code || e.message), true);
  }
}

/* ============================================================
   甘特图：横轴 = 整个赛程（JAM_DAYS 天），一行一个任务，
   色段 = 在某个状态里待了多久
   ============================================================ */
function renderGantt(){
  const box = document.getElementById("gantt");
  if(!box) return;

  // 图例
  document.getElementById("ganttLegend").innerHTML =
    STATUS_DEFS.map(s => `<span><i class="g-seg ${s.id}" style="position:static;top:auto;height:11px"></i>${s.zh}</span>`).join("") +
    `<span style="margin-left:auto;color:#ff007f;letter-spacing:1px;text-shadow:0 0 10px rgba(255,0,127,.6)">粉色竖线 = 现在</span>`;

  if(!tasks.length){
    box.innerHTML = `<div class="g-empty">还没有任务。去「看板」新建一个，拖动它就能在这里看到时间轴。</div>`;
    return;
  }

  const now    = Date.now();
  const today  = dayOf(now);
  const started = jamStarted();

  const head = `<div class="g-head"><div class="g-name">任务 / 负责人</div>` +
    `<div class="g-days" style="grid-template-columns:repeat(${JAM_DAYS},1fr)">` +
    Array.from({length:JAM_DAYS}, (_,i) => {
      const dd = new Date(jamStartMs() + i * DAY_MS);
      return `<div class="${started && i+1 === today ? "today" : ""}">第${i+1}天<br><span style="font-size:9px">${fmtDay(dd.getTime())}</span></div>`;
    }).join("") + `</div></div>`;

  // 按负责人分组，组内按状态/优先级
  const owners = [...new Set(tasks.map(t => t.owner))].sort(
    (a,b) => tasks.filter(x=>x.owner===b).length - tasks.filter(x=>x.owner===a).length
  );

  const rows = owners.map(owner => {
    const mine = tasks.filter(t => t.owner === owner).sort((a,b) =>
      (STATUS_IDS.indexOf(a.status) - STATUS_IDS.indexOf(b.status)) ||
      (PRI_RANK[a.priority] - PRI_RANK[b.priority]) ||
      String(a.title).localeCompare(String(b.title), "zh"));

    const head2 = `<div class="g-row" style="border-top:1px solid rgba(0,243,255,.3);background:rgba(0,243,255,.05)">` +
      `<div class="g-label"><span class="mini-avatar">${esc(avatar(owner))}</span>` +
      `<span style="font-size:12px;font-weight:700;color:#fff">${esc(owner)}</span>` +
      `<span style="font-size:10px;color:#5a6472">${mine.length} 个任务</span></div>` +
      `<div class="g-track"></div></div>`;

    const body = mine.map(t => {
      const segs = toSegments(t.history, now);
      const bars = segs.map(sg => {
        const l = pctOf(sg.from), r = pctOf(sg.to);
        const w = Math.max(r - l, 0.4);
        const tip = `${statusDef(sg.status).zh} · ${fmtDT(sg.from)} → ${fmtDT(sg.to)}（${shortDur(sg.to - sg.from)}）`;
        return `<div class="g-seg ${sg.status}" style="left:${l}%;width:${w}%" title="${esc(tip)}"></div>`;
      }).join("");
      const nowLine = (now >= jamStartMs() && now <= jamEndMs())
        ? `<div class="g-now" style="left:${pctOf(now)}%"></div>` : "";
      return `<div class="g-row">` +
        `<div class="g-label"><span class="priority ${t.priority.toLowerCase()}">${t.priority}</span>` +
        `<span class="gt" data-id="${esc(t.id)}" title="点开详情">${esc(t.title)}</span></div>` +
        `<div class="g-track">${bars}${nowLine}</div></div>`;
    }).join("");

    return head2 + body;
  }).join("");

  box.innerHTML = `<div class="g-inner" style="--dayw:${(100/JAM_DAYS).toFixed(6)}%;--days:${JAM_DAYS}">${head}${rows}</div>` +
    `<div class="g-note">色段数据来自看板上的拖动记录。<b>误拖了？</b>回到看板点提示里的「撤销」即可，` +
    `不会在时间轴上留下痕迹。` +
    (started ? `` : ` <b style="color:#ffbe0b">距开赛还有 ${Math.ceil((jamStartMs()-now)/DAY_MS)} 天</b>，` +
                    `开赛前的活动都会挤在横轴最左边。`) + `</div>`;

  box.querySelectorAll(".gt").forEach(el => {
    el.onclick = () => {
      const t = tasks.find(x => x.id === el.dataset.id);
      if(t) openDetail(t);
    };
  });
}

/* ============================================================
   Toast（带「撤销」）
   ============================================================ */
function showToast(msg, isErr, undoable){
  const x = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  x.className = "toast" + (isErr ? " err" : "") + (undoable ? " undoable" : "");
  x.classList.add("show");
  clearTimeout(window.tt);
  window.tt = setTimeout(() => {
    x.classList.remove("show");
    if(undoable) lastMove = null;   // 过了撤销窗口就作废
  }, undoable ? 6000 : (isErr ? 4200 : 1800));
}

window.openCreate   = openCreate;
window.closeModal   = closeModal;
window.createTask   = createTask;
window.retryConnect = retryConnect;
window.setView      = setView;
window.closeReject  = closeReject;
window.confirmReject= confirmReject;
window.undoMove     = undoMove;
window.openDetail   = openDetail;
window.closeDetail  = closeDetail;
window.saveDetail   = saveDetail;
window.deleteDetail = deleteDetail;
window.renderGantt  = renderGantt;
window.render       = render;

/* 卡片跟随鼠标的霓虹光斑（视觉规范里 .card::before 的那层径向光）
   用事件委托只挂一个监听，卡片频繁重画也不用重新绑定 */
document.addEventListener("mousemove", e => {
  const c = e.target.closest && e.target.closest(".card");
  if(!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty("--x", (e.clientX - r.left) + "px");
  c.style.setProperty("--y", (e.clientY - r.top) + "px");
});

/* ============================================================
   8) 启动
   ============================================================ */
(function boot(){
  document.getElementById("dayBadge").textContent = jamBadge();

  // 弹窗下拉
  const ownerOpts = MEMBERS.map(m => `<option>${esc(m)}</option>`).join("");
  const statusOpts = STATUS_DEFS.map(s => `<option value="${s.id}">${s.zh} · ${s.en}</option>`).join("");
  const typeOpts   = TYPE_DEFS.map(t => `<option value="${t.value}">${t.zh} · ${t.en}</option>`).join("");
  ["newOwner","dOwner"].forEach(id => document.getElementById(id).innerHTML = ownerOpts);
  ["newStatus","dStatus"].forEach(id => document.getElementById(id).innerHTML = statusOpts);
  ["newType","dType"].forEach(id => document.getElementById(id).innerHTML = typeOpts);

  render();  // 先画出骨架，别让首屏空着

  // 按 URL 的 #hash 决定打开哪个视图（方便直接把"时间轴"链接发给别人）
  setView((location.hash || "#board").slice(1));
  window.addEventListener("hashchange", () => setView((location.hash || "#board").slice(1), false));

  // Esc 关闭弹窗
  document.addEventListener("keydown", e => {
    if(e.key !== "Escape") return;
    ["modal","detailModal","rejectModal"].forEach(id => {
      const el = document.getElementById(id);
      if(el.style.display === "flex") el.style.display = "none";
    });
    detailId = null; rejectCtx = null;
  });

  // 8 秒还没等到响应就给个提示
  setTimeout(() => {
    if(booting) showToast("Firestore 响应较慢：检查网络，或确认规则已发布", true);
  }, 8000);

  try{
    startFirestore();
  }catch(e){
    fallBack("Firebase 初始化失败，已切到本地演示数据", e);
  }
})();
